services:
  mysql:
    image: mysql:8.0
    container_name: pairesume-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pai_resume_2024}
      MYSQL_DATABASE: pai_resume
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pairesume-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pairesume-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - pairesume-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pairesume-backend
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - APP_ENV=development
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=pai_resume
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-pai_resume_2024}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=${JWT_SECRET}
      - DEV_ACCOUNT_EMAIL=test@example.com
      - DEV_ACCOUNT_PASSWORD=Test123456
      - DEV_ADMIN_EMAIL=admin@example.com
      - DEV_ADMIN_PASSWORD=Admin123456
      - APP_CORS_ALLOWED_ORIGIN_PATTERNS=http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://127.0.0.1:5173
      - FIELD_OPTIMIZE_PROMPTS_FILE=config/field-optimize-prompts.yml
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com/v1}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
      - AI_ANALYSIS_MODEL=${AI_ANALYSIS_MODEL:-deepseek-chat}
    volumes:
      - ./config:/app/config
    networks:
      - pairesume-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pairesume-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - pairesume-net
    depends_on:
      - backend

networks:
  pairesume-net:
    name: pairesume-net
    driver: bridge

volumes:
  mysql_data:
    name: pairesume-mysql-data
  redis_data:
    name: pairesume-redis-data
